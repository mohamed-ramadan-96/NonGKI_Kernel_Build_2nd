name: 'Patch ReKernel for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Patch ReKernel
        if: env.REKERNEL_ENABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel/"

          if grep -q "cgroup_task_frozen" "kernel/cgroup.c" || grep -q "cgroup_task_frozen" "kernel/cgroup/cgroup.c"; then

            cp /tmp/Patches/Rekernel/rekernel_patches.sh ./
            bash rekernel_patches.sh

            cp /tmp/Patches/Rekernel/rekernel_extra.patch ./
            patch --batch --forward -p1 < rekernel_extra.patch

            DEFCONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
            if ! grep -qx 'CONFIG_REKERNEL=y' "$DEFCONFIG"; then
              echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
            fi

            echo "[+] Patched Re:Kernel for your kernel successfully."
          else

            echo "[-] Kernel's Cgroup is detected to be missing the specified function, please enable Re:Kernel after porting the full Cgroup V2."
            false
          fi
